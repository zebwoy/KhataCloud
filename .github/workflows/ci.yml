name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  typecheck-and-lint:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check (frontend)
        run: npx tsc --noEmit

      - name: TypeScript type check (API)
        run: npx tsc --noEmit --project tsconfig.node.json
        continue-on-error: true  # API tsconfig may not exist yet; don't block

  # Optional: add a build check to catch any Vite build errors
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: typecheck-and-lint
    # Only run on PRs to main (saves Actions minutes on feature branches)
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Vite build
        run: npm run build
        env:
          # Provide dummy env vars so the build doesn't fail on missing secrets
          VITE_BETTER_AUTH_URL: https://placeholder.vercel.app
